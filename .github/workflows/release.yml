name: Desktop apps

# Builds and packages the desktop app for Windows, macOS and Linux on x86-64
# and arm64, every one on a native runner. Every push to main leaves the six
# archives on its run's page; a v* tag also publishes them as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to main makes an unfinished build of the old one pointless; a
# tag's build always runs to the end.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      # Built once and shared, so every platform archive carries byte-identical
      # web assets. Building it per-platform would let them differ.
      - run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/app
          include-hidden-files: true

  package:
    name: ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on 22.04 so the binary links against an older glibc and
        # runs on more distributions than one built on the newest image would.
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      # The arm64 Linux and Windows images do not all carry rustup.
      - name: Install rustup if missing
        shell: bash
        run: |
          command -v rustup >/dev/null && exit 0
          if [ "${{ runner.os }}" = Windows ]; then
            arch=x86_64; [ "${{ runner.arch }}" = ARM64 ] && arch=aarch64
            curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/app

      # Receive mode (camera capture and native QR decoding) is macOS-only so
      # far; the other targets ship the sender alone.
      - name: Build
        shell: bash
        run: |
          features=""
          [ "${{ runner.os }}" = macOS ] && features="--features receive"
          cargo build -p desktop-sender --release --target ${{ matrix.target }} $features

      # Not every image has a python3 on its path (the arm64 Windows one may
      # not), so pin one that answers to `python` everywhere.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/desktop-sender
          [ -f "$binary.exe" ] && binary="$binary.exe"
          python scripts/package_release.py --target ${{ matrix.target }} --binary "$binary"
          python scripts/check-release.py "dist/${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/optical-transfer-${{ matrix.target }}.zip

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      # One checksum file across every archive, so a user can verify whichever
      # one they downloaded against a single list.
      - name: Checksum every archive
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body: |
            Optical Transfer — desktop sender and the offline web app (receiver and browser sender).

            **This transfer is not encrypted.** Any camera pointed at the
            sending screen can read it.

            Licensed AGPL-3.0-or-later; each archive carries `LICENSE`,
            `NOTICE.md` and a `SOURCE.txt` naming the commit it was built from.
            Verify a download against `SHA256SUMS`.

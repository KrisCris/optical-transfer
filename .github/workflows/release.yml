name: Release

on:
  push:
    tags: ["v*"]
  # So the packaging path can be exercised without minting a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  receiver:
    name: receiver bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      # Built once and shared, so every platform archive carries byte-identical
      # receiver assets. Building it per-platform would let them differ.
      - run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: receiver
          path: web/receiver
          include-hidden-files: true

  package:
    name: ${{ matrix.target }}
    needs: receiver
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: actions/download-artifact@v4
        with:
          name: receiver
          path: web/receiver

      - run: cargo build -p desktop-sender --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/desktop-sender
          [ -f "$binary.exe" ] && binary="$binary.exe"
          python3 scripts/package_release.py --target ${{ matrix.target }} --binary "$binary"
          python3 scripts/check-release.py "dist/${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/optical-transfer-${{ matrix.target }}.zip

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      # One checksum file across every archive, so a user can verify whichever
      # one they downloaded against a single list.
      - name: Checksum every archive
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body: |
            Optical Transfer — desktop sender and offline receiver.

            **This transfer is not encrypted.** Any camera pointed at the
            sending screen can read it.

            Licensed AGPL-3.0-or-later; each archive carries `LICENSE`,
            `NOTICE.md` and a `SOURCE.txt` naming the commit it was built from.
            Verify a download against `SHA256SUMS`.

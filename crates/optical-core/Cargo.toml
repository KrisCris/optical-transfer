[package]
name = "optical-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.0"
qrcodegen = "1.8.0"
# Wire v4's fountain code, RFC 6330. Pure Rust, so the same decoder runs in
# the browser and on the desktop.
raptorq = "2.0.1"
# Only for receivers that hand stats across a serialisation boundary (the
# browser); the desktop app reads them as plain Rust.
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
